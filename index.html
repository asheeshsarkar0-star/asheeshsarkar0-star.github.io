<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:Arial;
    background:#000;
    color:white;
    overflow-x:hidden;
}

/* ===========================
        HERO 3D PARALLAX
=========================== */
.hero{
    height:420px;
    position:relative;
    overflow:hidden;
}
.hero img{
    position:absolute;
    width:110%;
    height:110%;
    top:-5%;
    left:-5%;
    object-fit:cover;
    filter:brightness(0.8);
}
.hero-title{
    position:absolute;
    bottom:40px;
    width:100%;
    text-align:center;
    font-size:42px;
    font-weight:bold;
    background:linear-gradient(90deg,#ffd86b,#ffffff,#ffd86b);
    -webkit-background-clip:text;
    color:transparent;
    text-shadow:0 0 25px #000;
    opacity:0;
}

/* ===========================
        NAVIGATION
=========================== */
header{
    text-align:center;
    padding:20px;
    border-bottom:2px solid #d4af37;
    background:#000;
}
header h1{
    font-size:32px;
    background:linear-gradient(90deg,#ffd86b,#fff,#ffd86b);
    -webkit-background-clip:text;
    color:transparent;
}
nav{
    text-align:center;
    padding:12px;
    background:#111;
    border-bottom:2px solid #d4af37;
}
nav a{
    color:#d4af37;
    margin:0 18px;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
    transition:0.3s;
}
nav a:hover{
    color:white;
    text-shadow:0 0 12px #d4af37;
}

/* ===========================
        SECTION
=========================== */
.section{
    padding:25px;
}
.section h2{
    color:#d4af37;
    font-size:28px;
    margin-bottom:10px;
}

/* ===========================
        FLOAT CARDS
=========================== */
.card{
    background:rgba(255,255,255,0.06);
    border:2px solid rgba(212,175,55,0.5);
    padding:20px;
    margin-bottom:15px;
    border-radius:16px;
    backdrop-filter:blur(8px);
    transition:0.3s;
}
.card:hover{
    transform:scale(1.03) translateY(-8px);
    box-shadow:0 8px 25px rgba(212,175,55,0.5);
}

/* ===========================
        AUDIO PLAYER
=========================== */
.player-box{
    background:#111;
    border:2px solid #d4af37;
    padding:20px;
    border-radius:14px;
}
#playerTitle{
    font-size:20px;
    color:#d4af37;
    margin-bottom:8px;
}
.track{
    border:1px solid #d4af37;
    padding:12px;
    border-radius:10px;
    margin-bottom:7px;
    background:#000;
    cursor:pointer;
}
.track:hover{
    background:#222;
}
.controls{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:12px;
}
.controls div{
    background:#d4af37;
    width:55px;
    height:55px;
    border-radius:50%;
    color:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    cursor:pointer;
}

/* ===========================
       GALLERY
=========================== */
.gallery-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}
.gallery-grid img{
    width:100%;
    border-radius:12px;
    border:2px solid #d4af37;
    transition:0.3s;
}
.gallery-grid img:hover{
    transform:scale(1.05);
    box-shadow:0 0 25px #d4af37;
}

/* ===========================
        FOOTER
=========================== */
footer{
    margin-top:25px;
    background:#050505;
    padding:25px;
    border-top:3px solid #d4af37;
    text-align:center;
    color:#d4af37;
}
</style>
</head>

<!-- ALBUMS -->
<div class="section" id="albums">
<h2>My Albums</h2>

<button onclick="switchAlbum(1)" class="card">Album 1</button>
<button onclick="switchAlbum(2)" class="card">Album 2</button>

<div class="player-box">
    <div id="playerTitle">Select Track</div>
    <audio id="mainPlayer" controls></audio>
    <div id="playlistBox"></div>

    <div class="controls">
        <div onclick="prevTrack()">⏮</div>
        <div onclick="togglePlay()">⏯</div>
        <div onclick="nextTrack()">⏭</div>
    </div>
</div>
</div>

<script>
let album1=[
 {title:"Dhakano Ki Guzaarish",url:"https://github.com/asheeshsarkar0-star/asheeshsarkar0-star.github.io/raw/main/Dhakano%20Ki%20Guzaarish.mp3"},
 {title:"Kaash Tere Hote",url:"https://github.com/asheeshsarkar0-star/asheeshsarkar0-star.github.io/raw/main/Kaash%20Tere%20Hote.mp3"},
 {title:"Palko Me Chupa Lu",url:"https://github.com/asheeshsarkar0-star/asheeshsarkar0-star.github.io/raw/main/Palko%20Me%20Chupa%20Lu%20.mp3"},
 {title:"Prem Ki Vyatha 2",url:"https://github.com/asheeshsarkar0-star/asheeshsarkar0-star.github.io/raw/main/Prem%20Ki%20Vyatha%202.mp3"},
 {title:"Tere Ishq Me",url:"https://github.com/asheeshsarkar0-star/asheeshsarkar0-star.github.io/raw/main/Tere%20Ishq%20Me.mp3"}
];

let album2=[
 {title:"Tere Naam Ki Dhadkan",url:"https://github.com/asheeshsarkar0-star/asheeshsarkar0-star.github.io/raw/main/Tere%20Naam%20Ki%20Dhadkan%20.mp3"},
 {title:"Teri Baahon Me",url:"https://github.com/asheeshsarkar0-star/asheeshsarkar0-star.github.io/raw/main/Teri%20Baahon%20Me%20Khoya%20Hu%20.mp3"},
 {title:"Tujhse Juraa Har Pal",url:"https://github.com/asheeshsarkar0-star/asheeshsarkar0-star.github.io/raw/main/Tujhse%20Juraa%20Har%20Pal%20.mp3"}
];

let currentAlbum=album1;
let index=0;

function switchAlbum(a){
    currentAlbum=(a===1)?album1:album2;
    loadPlaylist();
    playTrack(0);
}
function loadPlaylist(){
    let box=document.getElementById("playlistBox");
    box.innerHTML="";
    currentAlbum.forEach((s,i)=>{
        box.innerHTML+=`<div class='track' onclick='playTrack(${i})'>${s.title}</div>`;
    });
}
loadPlaylist();
function playTrack(i){
    index=i;
    let p=document.getElementById("mainPlayer");
    p.src=currentAlbum[i].url;
    p.play();
    document.getElementById("playerTitle").innerText=currentAlbum[i].title;
}
function togglePlay(){
    let p=document.getElementById("mainPlayer");
    p.paused?p.play():p.pause();
}
function nextTrack(){
    index=(index+1)%currentAlbum.length;
    playTrack(index);
}
function prevTrack(){
    index=(index-1+currentAlbum.length)%currentAlbum.length;
    playTrack(index);
}
</script>
