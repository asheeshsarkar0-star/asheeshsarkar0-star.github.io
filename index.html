<style>
/* RESET */
*{margin:0;padding:0;box-sizing:border-box;}
body{
    background:#050505;
    color:#fff;
    font-family:Arial;
    overflow-x:hidden;
}

/* HEADER */
header{
    text-align:center;
    padding:22px;
    background:#000;
    border-bottom:3px solid #d4af37;
    box-shadow:0 0 25px #d4af37aa;
    position:sticky;
    top:0;

}
.shine{
    font-size:34px;
    font-weight:bold;
    background:linear-gradient(90deg,#d4af37,#ffffff,#b16cff,#d4af37);
    -webkit-background-clip:text;
    color:transparent;
}

/* NAV */
nav{
    background:#0c0c0c;
    text-align:center;
    padding:12px 0;
    border-bottom:2px solid #d4af37;
    box-shadow:0 0 20px #000;
}
nav a{
    color:#d4af37;
    text-decoration:none;
    margin:0 18px;
    font-size:18px;
    font-weight:bold;
}

/* BANNER */
.banner{
    width:100%;
    height:280px;
    background:url("https://raw.githubusercontent.com/asheeshsarkar0-star/asheeshsarkar0-star.github.io/refs/heads/main/file_000000006e687209bab84b93c50c5727.png") no-repeat center;
    background-size:cover;
    box-shadow:0 0 25px #d4af37aa;
    border-bottom:3px solid #d4af37;
}

/* SECTION */
section{padding:25px;}
h2{
    color:#d4af37;
    font-size:26px;
    margin-bottom:15px;
    text-shadow:0 0 10px #d4af37;
}

/* VIDEO */
iframe{
    width:100%;
    height:200px;
    border:2px solid #d4af37;
    border-radius:12px;
    margin-bottom:15px;
    box-shadow:0 0 20px #d4af37aa;
}

/* ---- PLAYER ---- */
.player-box{
    background:#0f0f0f;
    padding:20px;
    border-radius:14px;
    border:2px solid #b16cff;
    box-shadow:0 0 25px #b16cffaa;
}

.album-switch{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}
.album-switch button{
    flex:1;
    padding:12px;
    background:#d4af37;
    border:none;
    border-radius:10px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 15px #d4af37aa;
}

#playerTitle{
    color:#d4af37;
    margin-bottom:10px;
}

.track{
    padding:12px;
    background:#000;
    border:1px solid #d4af37;
    border-radius:10px;
    margin-bottom:8px;
    cursor:pointer;
}
.track:hover{
    background:#222;
}

/* CONTROLS */
.controls{
    display:flex;
    justify-content:center;
    gap:20px;
    margin:10px 0;
}
.controls div{
    width:55px;
    height:55px;
    border-radius:50%;
    background:#d4af37;
    color:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:26px;
    cursor:pointer;
    box-shadow:0 0 20px #d4af37;
}

/* GALLERY */
.gallery img{
    width:100%;
    border-radius:12px;
    border:2px solid #d4af37;
    margin-bottom:12px;
    box-shadow:0 0 20px #d4af37aa;
}

/* CONTACT */
form{
    background:#0f0f0f;
    border:2px solid #b16cff;
    padding:20px;
    border-radius:12px;
    box-shadow:0 0 25px #b16cffaa;
}
input,textarea{
    width:100%;
    padding:12px;
    margin-bottom:12px;
    border-radius:10px;
    border:1px solid #d4af37;
    background:#000;
    color:#fff;
}
button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#d4af37;
    color:#000;
    font-size:18px;
    cursor:pointer;
}

/* FOOTER */
footer{
    text-align:center;
    padding:20px;
    background:#000;
    border-top:3px solid #b16cff;
    box-shadow:0 -5px 25px #b16cffaa;
    margin-top:30px;
}
</style>
</head>

<section id="albums">

<button onclick="switchAlbum(1)">Album 1</button>
<button onclick="switchAlbum(2)">Album 2</button>
</div>

<div id="playerTitle">Select a Track</div>
<audio id="mainPlayer" controls></audio>

  <div onclick="prevTrack()">⏮</div>
  <div onclick="togglePlay()">⏯</div>
  <div onclick="nextTrack()">⏭</div>
</div>

<div id="playlistBox"></div>

<script>
/* ---- ALL SONGS ---- */

let album1=[
 {title:"Dhadkano Ki Guzarish",url:"https://github.com/asheeshsarkar0-star/asheeshsarkar0-star.github.io/raw/main/Dhakano%20Ki%20Guzaarish.mp3"},
 {title:"Kaash Tere Hote",url:"https://github.com/asheeshsarkar0-star/asheeshsarkar0-star.github.io/raw/main/Kaash%20Tere%20Hote.mp3"},
 {title:"Palko Me Chupa Lu",url:"https://github.com/asheeshsarkar0-star/asheeshsarkar0-star.github.io/raw/main/Palko%20Me%20Chupa%20Lu%20.mp3"},
 {title:"Prem Ki Vyatha 2",url:"https://github.com/asheeshsarkar0-star/asheeshsarkar0-star.github.io/raw/main/Prem%20Ki%20Vyatha%202.mp3"},
 {title:"Tere Ishq Me",url:"https://github.com/asheeshsarkar0-star/asheeshsarkar0-star.github.io/raw/main/Tere%20Ishq%20Me.mp3"}
];

let album2=[
 {title:"Tere Naam Ki Dhadkan",url:"https://github.com/asheeshsarkar0-star/asheeshsarkar0-star.github.io/raw/main/Tere%20Naam%20Ki%20Dhadkan%20.mp3"},
 {title:"Kaash Tere Hote (Cover)",url:"https://github.com/asheeshsarkar0-star/asheeshsarkar0-star.github.io/raw/main/Kaash%20Tere%20Hote%20(1).mp3"},
 {title:"Teri Baahon Me",url:"https://github.com/asheeshsarkar0-star/asheeshsarkar0-star.github.io/raw/main/Teri%20Baahon%20Me%20Khoya%20Hu%20.mp3"},
 {title:"Tujhse Juraa Har Pal",url:"https://github.com/asheeshsarkar0-star/asheeshsarkar0-star.github.io/raw/main/Tujhse%20Juraa%20Har%20Pal%20.mp3"}
];

let currentAlbum=album1;
let index=0;

function switchAlbum(a){
 currentAlbum = (a===1) ? album1 : album2;
 loadPlaylist();
 playTrack(0);
}

function loadPlaylist(){
 let box=document.getElementById("playlistBox");
 box.innerHTML="";
 currentAlbum.forEach((song,i)=>{
    box.innerHTML+=`<div class='track' onclick='playTrack(${i})'>${song.title}</div>`;
 });
}
loadPlaylist();

function playTrack(i){
 index=i;
 let p=document.getElementById("mainPlayer");
 p.src=currentAlbum[i].url;
 p.play();
 document.getElementById("playerTitle").innerText=currentAlbum[i].title;
}

function togglePlay(){
 let p=document.getElementById("mainPlayer");
 p.paused ? p.play() : p.pause();
}

function nextTrack(){
 index=(index+1)%currentAlbum.length;
 playTrack(index);
}

function prevTrack(){
 index=(index-1+currentAlbum.length)%currentAlbum.length;
 playTrack(index);
}
</script>
