<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asheesh Sarkar - Premium Music Website</title>

<!-- SEO -->
<meta name="description" content="Official Music Website of Asheesh Sarkar – Composer • Songwriter • Artist">
<meta name="keywords" content="Asheesh Sarkar, Music, Songs, Hindi, Sanskrit, Composer, Artist">
<meta property="og:title" content="Asheesh Sarkar - Music Website">
<meta property="og:description" content="Listen to albums, watch videos and more.">
<meta property="og:image" content="cover.png">
<meta name="theme-color" content="#d4af37">

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0d0d0d;font-family:Arial;color:#fff;overflow-x:hidden;transition:0.4s;}
.light{background:#f2f2f2;color:#000;}
.dark{background:#0d0d0d;color:#fff;}

/* Loader */
#loader{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;
display:flex;justify-content:center;align-items:center;z-index:9999;}
#loader div{width:60px;height:60px;border:6px solid #d4af37;border-radius:50%;
border-top-color:transparent;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);} }

/* Header */
header{text-align:center;padding:20px;background:#000;border-bottom:2px solid #d4af37;
position:sticky;top:0;z-index:10;}
.shine{font-size:32px;font-weight:bold;background:linear-gradient(90deg,#d4af37,#fff,#d4af37);
-webkit-background-clip:text;color:transparent;}
.toggle{position:absolute;right:20px;top:20px;font-size:22px;cursor:pointer;}

/* Nav */
nav{background:#111;text-align:center;padding:12px 0;border-bottom:2px solid #d4af37;}
nav a{color:#d4af37;text-decoration:none;font-size:18px;margin:0 20px;font-weight:bold;}

/* Slides */
.slides{width:100%;height:260px;position:relative;overflow:hidden;margin-top:10px;}
.slide{width:100%;height:260px;position:absolute;opacity:0;transition:.8s;}
.slide img{width:100%;height:260px;object-fit:cover;}
.slide.active{opacity:1;}

/* Sections */
section{padding:25px;}
h2{color:#d4af37;font-size:26px;margin-bottom:10px;}

/* Player */
.player-box{background:#111;padding:20px;border-radius:12px;border:2px solid #d4af37;}
#playerTitle{color:#d4af37;font-size:20px;margin-bottom:8px;}
#mainPlayer{width:100%;border-radius:10px;margin-bottom:10px;}
.track{background:#000;border:1px solid #d4af37;padding:12px;border-radius:10px;
margin:6px 0;cursor:pointer;}
.track:hover{background:#222;}

.controls{display:flex;justify-content:center;gap:20px;margin:10px 0;}
.controls div{width:55px;height:55px;background:#d4af37;color:#000;font-size:28px;
border-radius:50%;display:flex;justify-content:center;align-items:center;cursor:pointer;}

/* Gallery */
.gallery img{width:100%;border:2px solid #d4af37;border-radius:12px;margin:10px 0}

/* Footer */
footer{text-align:center;padding:20px;background:#000;border-top:2px solid #d4af37;}
</style>
</head>

<body class="dark">

<!-- Loader -->
<div id="loader"><div></div></div>
<script>
window.onload=function(){document.getElementById("loader").style.display="none";}
</script>

<header>
<div class="shine">ASHEESH SARKAR</div>
<div class="toggle" onclick="toggleMode()">🌙</div>
</header>

<script>
function toggleMode(){
 let body=document.body;
 body.classList.toggle("light");body.classList.toggle("dark");
 document.querySelector('.toggle').innerHTML =
 body.classList.contains("light") ? "☀️" : "🌙";
}
</script>

<nav>
<a href="#home">Home</a>
<a href="#music">Videos</a>
<a href="#album">Album</a>
<a href="#gallery">Gallery</a>
<a href="#contact">Contact</a>
</nav>

<!-- Slideshow -->
<div class="slides">
 <div class="slide active"><img src="slide1.png"></div>
 <div class="slide"><img src="slide2.png"></div>
</div>

<script>
let s=0;
setInterval(()=>{
 let slides=document.querySelectorAll('.slide');
 slides.forEach(x=>x.classList.remove('active'));
 s=(s+1)%slides.length;
 slides[s].classList.add('active');
},3000);
</script>

<section id="home">
<h2>About Me</h2>
<p>Main Asheesh Sarkar — Music Composer & Songwriter.</p>
</section>

<section id="music">
<h2>My Music Videos</h2>
<iframe src="https://www.youtube.com/embed/_FR2jTaPEio"></iframe>
<iframe src="https://www.youtube.com/embed/H6ofrzz8yXM"></iframe>
</section>

<section id="album">
<h2>🎵 Album — Kaash Tere Hote</h2>

<div class="player-box">
<div id="playerTitle">Select a Track</div>

<audio id="mainPlayer" controls></audio>

<div class="controls">
 <div onclick="prevTrack()">⏮</div>
 <div onclick="togglePlay()">⏯</div>
 <div onclick="nextTrack()">⏭</div>
</div>

<div id="playlistBox"></div>
</div>
</section>

<script>
let album=[
 {title:"Kaash Tere Hote (Version 1)", url:"https://github.com/asheeshsarkar0-star/asheeshsarkar0-star.github.io/raw/refs/heads/main/Kaash%20Tere%20Hote%20(1).mp3"},
 {title:"Kaash Tere Hote (Version 2)", url:"https://github.com/asheeshsarkar0-star/asheeshsarkar0-star.github.io/raw/refs/heads/main/Kaash%20Tere%20Hote.mp3"}
];

let index=0;

function loadPlaylist(){
 let box=document.getElementById("playlistBox");
 box.innerHTML="";
 album.forEach((t,i)=>{
  box.innerHTML+=`<div class='track' onclick='playTrack(${i})'>${t.title}</div>`;
 });
}
loadPlaylist();

function playTrack(i){
 index=i;
 let p=document.getElementById("mainPlayer");
 p.src=album[i].url;
 p.play();
 document.getElementById("playerTitle").innerText=album[i].title;
}

function togglePlay(){
 let p=document.getElementById("mainPlayer");
 p.paused ? p.play() : p.pause();
}

function nextTrack(){
 index=(index+1)%album.length;
 playTrack(index);
}

function prevTrack(){
 index=(index-1+album.length)%album.length;
 playTrack(index);
}
</script>

<section id="gallery">
<h2>Gallery</h2>
<div class="gallery">
<img src="gallery1.png">
<img src="gallery2.png">
</div>
</section>

<section id="contact">
<h2>Contact</h2>
<form>
<input type="text" placeholder="Your Name">
<input type="email" placeholder="Email">
<textarea rows="5" placeholder="Message"></textarea>
<button>Send</button>
</form>
</section>

<footer>
© 2026 Asheesh Sarkar | All Rights Reserved.
</footer>

</body>
</html>
