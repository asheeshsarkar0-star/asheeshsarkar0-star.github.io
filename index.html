<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asheesh Sarkar - Official Music Website</title>

<!-- SEO -->
<meta name="description" content="Official Music Website of Asheesh Sarkar – Composer • Songwriter • Artist">
<meta name="keywords" content="Asheesh Sarkar, Music, Hindi Songs, Composer, Artist, Songwriter">
<meta property="og:title" content="Asheesh Sarkar - Music Website">
<meta property="og:description" content="Listen to Albums, Watch Videos & Explore Music by Asheesh Sarkar.">
<meta property="og:image" content="cover.png">
<meta name="theme-color" content="#d4af37">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    background:#0d0d0d;
    color:#fff;
    font-family:Arial;
    overflow-x:hidden;
}

/* HEADER */
header{
    text-align:center;
    padding:20px;
    background:#000;
    border-bottom:3px solid #d4af37;
    position:sticky;
    top:0;
    z-index:1000;
}
.shine{
    font-size:34px;
    font-weight:bold;
    background:linear-gradient(90deg,#d4af37,#ffffff,#d4af37);
    -webkit-background-clip:text;
    color:transparent;
}

/* NAVBAR */
nav{
    background:#111;
    border-bottom:2px solid #d4af37;
    text-align:center;
    padding:12px 0;
}
nav a{
    color:#d4af37;
    text-decoration:none;
    margin:0 20px;
    font-size:18px;
    font-weight:bold;
}

/* SLIDESHOW */
.slides{
    width:100%;
    height:240px;
    overflow:hidden;
    position:relative;
    margin-top:10px;
}
.slide{
    position:absolute;
    width:100%;
    height:240px;
    opacity:0;
    transition:1s;
}
.slide img{
    width:100%;
    height:240px;
    object-fit:cover;
}
.slide.active{
    opacity:1;
}

/* SECTIONS */
section{
    padding:25px;
}
h2{
    color:#d4af37;
    margin-bottom:15px;
    font-size:26px;
}

/* VIDEOS */
iframe{
    width:100%;
    height:200px;
    border-radius:12px;
    border:2px solid #d4af37;
    margin-bottom:15px;
}

/* PLAYER BOX */
.player-box{
    background:#111;
    padding:20px;
    border-radius:12px;
    border:2px solid #d4af37;
}
#playerTitle{
    font-size:20px;
    color:#d4af37;
    margin-bottom:10px;
}
.track{
    padding:12px;
    background:#000;
    border:1px solid #d4af37;
    border-radius:10px;
    margin-bottom:6px;
    cursor:pointer;
}
.track:hover{
    background:#222;
}
.controls{
    display:flex;
    justify-content:center;
    gap:20px;
    margin:10px 0;
}
.controls div{
    width:55px;
    height:55px;
    background:#d4af37;
    border-radius:50%;
    color:#000;
    font-size:28px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
}

/* GALLERY */
.gallery img{
    width:100%;
    border-radius:12px;
    border:2px solid #d4af37;
    margin-bottom:12px;
}

/* CONTACT */
form{
    background:#111;
    padding:20px;
    border-radius:12px;
    border:2px solid #d4af37;
}
input, textarea{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border-radius:10px;
    border:1px solid #d4af37;
    background:#000;
    color:#fff;
}
button{
    width:100%;
    padding:12px;
    border:none;
    background:#d4af37;
    color:#000;
    font-size:18px;
    border-radius:10px;
    cursor:pointer;
}

/* FOOTER */
footer{
    text-align:center;
    padding:20px;
    background:#000;
    border-top:2px solid #d4af37;
    margin-top:20px;
}
</style>
</head>

<body>

<header>
    <div class="shine">ASHEESH SARKAR</div>
</header>

<nav>
    <a href="#home">Home</a>
    <a href="#videos">Videos</a>
    <a href="#albums">Albums</a>
    <a href="#gallery">Gallery</a>
    <a href="#contact">Contact</a>
</nav>

<!-- SLIDES -->
<div class="slides">
    <div class="slide active"><img src="slide1.png"></div>
    <div class="slide"><img src="slide2.png"></div>
</div>

<script>
let s=0;
setInterval(()=>{
    let slides=document.querySelectorAll(".slide");
    slides.forEach(x=>x.classList.remove("active"));
    s=(s+1)%slides.length;
    slides[s].classList.add("active");
},3000);
</script>

<section id="home">
    <h2>About Me</h2>
    <p>Main Asheesh Sarkar — Music Composer & Songwriter.</p>
</section>

<section id="videos">
    <h2>My Music Videos</h2>
    <iframe src="https://www.youtube.com/embed/_FR2jTaPEio"></iframe>
    <iframe src="https://www.youtube.com/embed/H6ofrzz8yXM"></iframe>
</section>

<section id="albums">
    <h2>🎵 Albums</h2>

    <div style="display:flex; gap:10px; margin-bottom:15px;">
        <button onclick="switchAlbum(1)" style="flex:1;padding:12px;background:#d4af37;color:#000;font-weight:bold;border:none;border-radius:10px;">Album 1</button>
        <button onclick="switchAlbum(2)" style="flex:1;padding:12px;background:#d4af37;color:#000;font-weight:bold;border:none;border-radius:10px;">Album 2</button>
    </div>

    <div class="player-box">
        <div id="playerTitle">Select a Track</div>

        <audio id="mainPlayer" controls></audio>

        <div class="controls">
            <div onclick="prevTrack()">⏮</div>
            <div onclick="togglePlay()">⏯</div>
            <div onclick="nextTrack()">⏭</div>
        </div>

        <div id="playlistBox"></div>
    </div>
</section>

<script>
let album1=[
 {title:"Kaash Tere Hote (Version 1)",url:"Kaash Tere Hote (1).mp3"}
];

let album2=[
 {title:"Kaash Tere Hote (Version 2)",url:"Kaash Tere Hote.mp3"}
];

let currentAlbum=album1;
let index=0;

function switchAlbum(a){
    currentAlbum = (a===1) ? album1 : album2;
    loadPlaylist();
    playTrack(0);
}

function loadPlaylist(){
    let box=document.getElementById("playlistBox");
    box.innerHTML="";
    currentAlbum.forEach((song,i)=>{
        box.innerHTML+=`<div class='track' onclick='playTrack(${i})'>${song.title}</div>`;
    });
}
loadPlaylist();

function playTrack(i){
    index=i;
    let p=document.getElementById("mainPlayer");
    p.src=currentAlbum[i].url;
    p.play();
    document.getElementById("playerTitle").innerText=currentAlbum[i].title;
}

function togglePlay(){
    let p=document.getElementById("mainPlayer");
    p.paused ? p.play() : p.pause();
}
function nextTrack(){
    index=(index+1)%currentAlbum.length;
    playTrack(index);
}
function prevTrack(){
    index=(index-1+currentAlbum.length)%currentAlbum.length;
    playTrack(index);
}
</script>

<section id="gallery">
<h2>Gallery</h2>
<div class="gallery">
    <img src="gallery1.png">
    <img src="gallery2.png">
</div>
</section>

<section id="contact">
<h2>Contact</h2>
<form>
    <input type="text" placeholder="Your Name">
    <input type="email" placeholder="Email">
    <textarea rows="5" placeholder="Message"></textarea>
    <button>Send</button>
</form>
</section>

<footer>
© 2026 Asheesh Sarkar | All Rights Reserved.
</footer>

</body>
</html>
