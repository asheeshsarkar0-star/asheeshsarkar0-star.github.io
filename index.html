<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
   font-family: Poppins, Arial;
   background:#000;
   color:white;
   overflow-x:hidden;
}

/* ===========================
      ULTRA 3D PARALLAX HERO
   =========================== */
.hero{
   position:relative;
   height:450px;
   overflow:hidden;
   perspective:1600px;
}
.layer{
   position:absolute;
   width:120%;
   height:120%;
   top:-10%;
   left:-10%;
   transition:transform .2s linear;
   background-size:cover;
   background-position:center;
}
.layer.bg1{
   background:url("https://raw.githubusercontent.com/asheeshsarkar0-star/asheeshsarkar0-star.github.io/main/file_000000006e687209bab84b93c50c5727.png");
   z-index:1;
   filter:brightness(0.8) contrast(1.15);
}
.layer.bg2{
   background:url("https://raw.githubusercontent.com/asheeshsarkar0-star/asheeshsarkar0-star.github.io/main/file_000000005034720792453fffe09544aa%20(1).png");
   opacity:0.40;
   mix-blend-mode:screen;
   z-index:3;
}
.hero-title{
   position:absolute;
   bottom:50px;
   width:100%;
   text-align:center;
   z-index:10;
   font-size:42px;
   font-weight:900;
   letter-spacing:3px;
   background:linear-gradient(90deg,#e3d28f,#fff,#e3d28f);
   -webkit-background-clip:text;
   color:transparent;
   text-shadow:0 0 35px #000,0 0 45px #d4af37;
}

/* HEADER */
header{
    text-align:center;
    padding:22px;
    background:#000;
    border-bottom:3px solid #d4af37;
}
.shine{
   font-size:36px;
   font-weight:900;
   background:linear-gradient(90deg,#d4af37,#fff,#d4af37);
   -webkit-background-clip:text;
   color:transparent;
   text-shadow:0 0 15px #d4af37aa;
}

/* NAVIGATION */
nav{
    text-align:center;
    padding:14px 0;
    background:#111;
    border-bottom:2px solid #d4af37;
}
nav a{
    color:#d4af37;
    margin:0 20px;
    text-decoration:none;
    font-size:19px;
    font-weight:bold;
    transition:0.3s;
}
nav a:hover{
    color:white;
    text-shadow:0 0 15px #d4af37;
}
</style>
</head>

<!-- ULTRA 3D HERO -->
<div class="hero" id="home">
   <div class="layer bg1" data-speed="3"></div>
   <div class="layer bg2" data-speed="7"></div>
   <div class="hero-title">Official Artist Portfolio</div>
</div>

<script>
document.addEventListener("mousemove", function(e){
   document.querySelectorAll(".layer").forEach(layer=>{
      let speed = layer.getAttribute("data-speed");
      let x = (window.innerWidth - e.pageX*speed)/90;
      let y = (window.innerHeight - e.pageY*speed)/90;
      layer.style.transform = `translateX(${x}px) translateY(${y}px)`;
   });
});
</script>

<style>

   border:2px solid #d4af37;

   height:55px;

   font-size:28px;
   color:#000;
   display:flex;
   justify-content:center;
   align-items:center;
   cursor:pointer;
}
</style>

<script>
let album1=[
 {title:"Dhakano Ki Guzaarish",url:"https://raw.githubusercontent.com/asheeshsarkar0-star/asheeshsarkar0-star.github.io/main/Dhakano%20Ki%20Guzaarish.mp3"},
 {title:"Kaash Tere Hote",url:"https://raw.githubusercontent.com/asheeshsarkar0-star/asheeshsarkar0-star.github.io/main/Kaash%20Tere%20Hote.mp3"},
 {title:"Palko Me Chupa Lu",url:"https://raw.githubusercontent.com/asheeshsarkar0-star/asheeshsarkar0-star.github.io/main/Palko%20Me%20Chupa%20Lu%20.mp3"},
 {title:"Prem Ki Vyatha 2",url:"https://raw.githubusercontent.com/asheeshsarkar0-star/asheeshsarkar0-star.github.io/main/Prem%20Ki%20Vyatha%202.mp3"},
 {title:"Tere Ishq Me",url:"https://raw.githubusercontent.com/asheeshsarkar0-star/asheeshsarkar0-star.github.io/main/Tere%20Ishq%20Me.mp3"},
 {title:"Tere Naam Ki Dhadkan",url:"https://raw.githubusercontent.com/asheeshsarkar0-star/asheeshsarkar0-star.github.io/main/Tere%20Naam%20Ki%20Dhadkan%20.mp3"},
 {title:"Teri Baahon Me",url:"https://raw.githubusercontent.com/asheeshsarkar0-star/asheeshsarkar0-star.github.io/main/Teri%20Baahon%20Me%20Khoya%20Hu%20.mp3"},
 {title:"Tujhse Juraa Har Pal",url:"https://raw.githubusercontent.com/asheeshsarkar0-star/asheeshsarkar0-star.github.io/main/Tujhse%20Juraa%20Har%20Pal%20.mp3"}
];

let currentAlbum=album1;
let index=0;

function switchAlbum(){
 loadPlaylist();
 playTrack(0);
}
function loadPlaylist(){
 document.getElementById("playlistBox").innerHTML="";
 currentAlbum.forEach((s,i)=>{
  document.getElementById("playlistBox").innerHTML+=`<div class='track' onclick='playTrack(${i})'>${s.title}</div>`;
 });
}
loadPlaylist();

function playTrack(i){
 index=i;
 let p=document.getElementById("mainPlayer");
 p.src=currentAlbum[i].url;
 p.play();
 document.getElementById("playerTitle").innerText=currentAlbum[i].title;
}
function togglePlay(){let p=document.getElementById("mainPlayer");p.paused?p.play():p.pause();}
function nextTrack(){index=(index+1)%currentAlbum.length;playTrack(index);}
function prevTrack(){index=(index-1+currentAlbum.length)%currentAlbum.length;playTrack(index);}
</script>
