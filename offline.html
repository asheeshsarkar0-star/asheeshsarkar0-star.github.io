<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline - Asheesh Sarkar</title>

<style>
body{
  background:#000;
  color:#d4af37;
  font-family:Arial;
  text-align:center;
  padding:40px;
}

.box{
  border:2px solid #d4af37;
  padding:30px;
  border-radius:18px;
  background:#0d0d0d;
  box-shadow:0 0 25px #d4af37aa;
  max-width:420px;
  margin:auto;
}

h1{
  font-size:32px;
  margin-bottom:10px;
  color:#d4af37;
  text-shadow:0 0 12px #d4af37;
}

p{
  font-size:18px;
  color:#ffffffcc;
  line-height:1.6;
}

.icon{
  font-size:50px;
  margin-bottom:15px;
}
</style>

</head>
<body>

<div class="box">
  <div class="icon">📴</div>
  <h1>No Internet</h1>
  <p>Aap offline ho.<br>  
  App offline mode me open ho rahi hai.</p>
  <p>Internet aate hi saare features resume ho jayenge.</p>
</div>

</body>
</html>
